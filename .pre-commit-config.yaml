minimum_pre_commit_version: "4.7.0"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: unsupported
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
