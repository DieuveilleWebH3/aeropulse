[project]
name = "aeropulse"
version = "0.1.0"
description = "Predictive Maintenance and Fleet Health Monitoring Platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1,<2.5",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.6,<0.14"

[tool.ruff]
required-version = ">=0.17.3,<0.18"
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --cov=aeropulse --cov-report=term-missing:skip-covered --cov-fail-under=90"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["aeropulse"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
