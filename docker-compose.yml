name: aeropulse

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${AEROPULSE_POSTGRES_DB:-aeropulse}
      POSTGRES_USER: ${AEROPULSE_POSTGRES_USER:-aeropulse}
      POSTGRES_PASSWORD: ${AEROPULSE_POSTGRES_PASSWORD:-aeropulse_dev}
    ports:
      - "127.0.0.1:${AEROPULSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:${AEROPULSE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
