name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aeropulse
          POSTGRES_USER: aeropulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeropulse -d aeropulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      AEROPULSE_ENVIRONMENT: test
      AEROPULSE_DATABASE_URL: postgresql+asyncpg://aeropulse@127.0.0.1:5432/aeropulse
      AEROPULSE_REDIS_URL: redis://127.0.0.1:6379/0
      AEROPULSE_DEPENDENCY_TIMEOUT_SECONDS: "1.0"
      AEROPULSE_RUN_EXTERNAL_SERVICE_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.14.10

      - name: Validate dependency lock
        run: uv lock --check

      - name: Sync project
        run: uv sync --locked --group dev

      - name: Verify Python runtime
        run: >-
          uv run --locked python -c
          "import sys; assert sys.version_info[:3] == (3, 14, 10), sys.version"

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy

      - name: Test
        run: uv run --locked pytest
